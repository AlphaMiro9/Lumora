name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versions-Tag, z. B. v0.5.2'
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test Lumora.sln -c Release
      - run: |
          dotnet publish src/Lumora -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/win-x64
          dotnet publish src/Lumora -c Release -r win-arm64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/win-arm64
          Copy-Item publish/win-x64/Lumora.exe Lumora-win-x64.exe
          Copy-Item publish/win-arm64/Lumora.exe Lumora-win-arm64.exe
          $sums = foreach ($f in 'Lumora-win-x64.exe','Lumora-win-arm64.exe') { (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + '  ' + $f }
          $sums | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Lumora ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            Lumora-win-x64.exe
            Lumora-win-arm64.exe
            SHA256SUMS.txt
